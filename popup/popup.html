<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>BrushBuddy</title>
    <link rel="stylesheet" href="../ui/theme.css" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="top">
      <div class="brand">
        <img class="logo-img" alt="" width="36" height="36" />
        <div>
          <h1>BrushBuddy</h1>
          <p class="muted">Pops up when it’s time to brush — on whatever site you’re on.</p>
        </div>
      </div>
      <label class="switch">
        <input id="enabled" type="checkbox" aria-label="Turn reminders on or off" />
        <span class="track"></span>
      </label>
    </header>

    <section class="next card">
      <img id="next-buddy" class="next-buddy" alt="" width="64" height="64" />
      <div>
        <p id="eyebrow" class="eyebrow">Next</p>
        <p id="next-title" class="next-title">Loading…</p>
        <p id="next-sub" class="muted"></p>
        <p id="done-line" class="done-line" hidden>Marked done today</p>
      </div>
    </section>

    <section class="panel card">
      <p class="panel-title">Your times</p>
      <ul id="list" class="list"></ul>
      <button id="add" type="button" class="add">Add a time</button>
    </section>

    <section class="panel card prefs">
      <p class="panel-title">Alert sound</p>
      <p class="sound-hint">Plays when a reminder pops up. Buddy and notifications stay on.</p>
      <div class="sound-tools">
        <select id="sound-tone" class="sound-select" aria-label="Alert sound"></select>
        <button type="button" id="sound-play" class="btn ghost sound-play">Play</button>
      </div>
    </section>

    <section class="actions card">
      <div id="waiting" class="waiting" hidden>
        <p class="panel-title">He’s on your tabs</p>
        <div class="action-row">
          <button id="mark-done" type="button" class="btn primary">Done</button>
          <button id="mark-snooze" type="button" class="btn ghost">Snooze 10 min</button>
        </div>
      </div>
      <button id="preview" type="button" class="btn ghost preview-btn">Preview buddy</button>
    </section>

    <footer class="foot">
      <a href="../privacy.html" target="_blank" rel="noopener noreferrer">Privacy</a>
      <a href="../terms.html" target="_blank" rel="noopener noreferrer">Terms</a>
      <span id="version" class="muted"></span>
    </footer>
    <p id="status" class="status" role="status"></p>
    <script src="../lib/site-urls.js"></script>
    <script src="../lib/storage.js"></script>
    <script src="../lib/characters.js"></script>
    <script src="../lib/sound-tones.js"></script>
    <script src="../lib/alert-sound.js"></script>
    <script src="../lib/time.js"></script>
    <script src="../lib/confirm.js"></script>
    <script src="../lib/reminders-editor.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
