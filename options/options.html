<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BrushBuddy settings</title>
    <link rel="stylesheet" href="../ui/theme.css" />
    <link rel="stylesheet" href="options.css" />
  </head>
  <body class="page">
    <header class="hero">
      <div class="brand">
        <img id="hero-buddy" class="hero-buddy" alt="" width="72" height="72" />
        <div>
          <h1>BrushBuddy</h1>
          <p class="lede">Same settings as the toolbar popup — use whichever you prefer.</p>
        </div>
      </div>
      <div class="hero-actions">
        <button id="preview" type="button" class="btn ghost">Preview</button>
        <label class="switch">
          <input id="enabled" type="checkbox" aria-label="Turn reminders on or off" />
          <span class="track"></span>
        </label>
      </div>
    </header>

    <section>
      <h2>Your times</h2>
      <ul id="list" class="list"></ul>
      <button id="add" type="button" class="add">Add a time</button>
      <p id="status" class="fine" role="status"></p>
    </section>

    <section>
      <h2>How it feels</h2>
      <div class="prefs card">
        <label class="check"><input id="sound" type="checkbox" /> Play alert sound</label>
        <label class="check"><input id="notifications" type="checkbox" /> Notify me if no page is open</label>
        <label class="check"><input id="motivation" type="checkbox" /> Show “Two minutes is enough.”</label>
      </div>
    </section>

    <section id="recommended" hidden>
      <h2>Recommended</h2>
      <div id="products" class="products"></div>
      <p id="disclosure" class="fine"></p>
    </section>

    <footer class="footer">
      <a href="../privacy.html" target="_blank" rel="noopener noreferrer">Privacy</a>
      <a href="../terms.html" target="_blank" rel="noopener noreferrer">Terms</a>
      <span id="version"></span>
    </footer>

    <script src="../lib/characters.js"></script>
    <script src="../lib/time.js"></script>
    <script src="../lib/reminders-editor.js"></script>
    <script src="../lib/affiliates.js"></script>
    <script src="options.js"></script>
  </body>
</html>
