<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BrushBuddy settings</title>
    <link rel="stylesheet" href="../ui/theme.css" />
    <link rel="stylesheet" href="options.css" />
  </head>
  <body class="page extension-settings">
    <header class="hero">
      <div class="brand">
        <img id="hero-buddy" class="hero-buddy" alt="" width="72" height="72" />
        <div>
          <h1>BrushBuddy</h1>
          <p class="lede">Friendly brush reminders on your open tabs — your buddy, a chime, and a quick nudge when it’s time.</p>
        </div>
      </div>
      <div class="hero-actions">
        <button id="preview" type="button" class="btn ghost">Preview</button>
        <label class="switch">
          <input id="enabled" type="checkbox" aria-label="Turn reminders on or off" />
          <span class="track"></span>
        </label>
      </div>
    </header>

    <section>
      <h2>Your times</h2>
      <ul id="list" class="list"></ul>
      <button id="add" type="button" class="add">Add a time</button>
      <p id="status" class="fine" role="status"></p>
    </section>

    <section>
      <h2>Alert sound</h2>
      <div class="prefs card">
        <p class="sound-hint">Plays when a reminder pops up. Your buddy and notifications stay on.</p>
        <div class="sound-tools">
          <select id="sound-tone" class="sound-select" aria-label="Alert sound"></select>
          <button type="button" id="sound-play" class="btn ghost sound-play">Play</button>
        </div>
        <div class="snooze-tools">
          <span class="snooze-label">Snooze for</span>
          <select id="snooze-duration" class="sound-select" aria-label="Snooze duration"></select>
        </div>
      </div>
    </section>

    <section id="support" hidden>
      <h2>Keep it going</h2>
      <div class="support card store-support">
        <p id="support-headline" class="support-headline"></p>
        <p id="support-blurb" class="support-blurb"></p>
        <a id="support-link" class="btn primary support-link" href="#" target="_blank" rel="noopener noreferrer"></a>
      </div>
    </section>

    <section id="recommended" hidden>
      <h2>Recommended</h2>
      <div id="products" class="products store-compact"></div>
      <p id="disclosure" class="fine"></p>
    </section>

    <footer class="footer">
      <a href="../privacy.html" target="_blank" rel="noopener noreferrer">Privacy</a>
      <a href="../terms.html" target="_blank" rel="noopener noreferrer">Terms</a>
      <button type="button" id="bug-report" class="footer-bug">Report a bug</button>
      <span id="version"></span>
    </footer>

    <script src="../lib/site-urls.js"></script>
    <script src="../lib/sound-tones.js"></script>
    <script src="../lib/alert-sound.js"></script>
    <script src="../lib/characters.js"></script>
    <script src="../lib/time.js"></script>
    <script src="../lib/confirm.js"></script>
    <script src="../lib/reminders-editor.js"></script>
    <script src="../lib/affiliates.js"></script>
    <script src="../lib/support.js"></script>
    <script src="../lib/bug-report.js"></script>
    <script src="options.js"></script>
  </body>
</html>
