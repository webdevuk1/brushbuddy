<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BrushBuddy</title>
    <link rel="stylesheet" href="site.css?v=6" />
  </head>
  <body class="page">
    <p id="install-banner" class="banner" hidden>
      Install the <strong>BrushBuddy</strong> extension in Chrome, then reload this page to sync settings with the toolbar popup.
    </p>

    <header class="hero">
      <div class="brand">
        <img id="hero-buddy" class="hero-buddy" src="assets/hero-buddy.png" alt="" width="72" height="72" />
        <div>
          <h1>BrushBuddy</h1>
          <p class="lede">Same settings as the toolbar popup — use whichever you prefer.</p>
        </div>
      </div>
      <div class="hero-actions">
        <button id="preview" type="button" class="btn ghost">Preview</button>
        <label class="switch">
          <input id="enabled" type="checkbox" aria-label="Turn reminders on or off" />
          <span class="track"></span>
        </label>
      </div>
    </header>

    <section>
      <h2>Your times</h2>
      <ul id="list" class="list"></ul>
      <button id="add" type="button" class="add">Add a time</button>
      <p id="status" class="fine" role="status"></p>
    </section>

    <section>
      <h2>How it feels</h2>
      <div class="prefs card">
        <label class="check"><input id="sound" type="checkbox" /> Play alert sound</label>
        <label class="check"><input id="notifications" type="checkbox" /> Notify me if no page is open</label>
        <label class="check"><input id="motivation" type="checkbox" /> Show “Two minutes is enough.”</label>
      </div>
    </section>

    <section id="recommended">
      <h2>Recommended</h2>
      <div id="products" class="products"></div>
      <p id="disclosure" class="fine"></p>
    </section>

    <footer class="footer">
      <span>
        <a href="privacy.html">Privacy</a>
        <a href="terms.html">Terms</a>
      </span>
      <span>v0.3.8</span>
    </footer>

    <script src="js/site-api.js"></script>
    <script src="js/reminders-editor.js"></script>
    <script src="js/site-app.js"></script>
  </body>
</html>
